name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan for Leaked Secrets
        uses: gitleaks/gitleaks-action@f586c14365d4643c6aa59d472ae6e984bf47bb34 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Typecheck, Lint, Tests & Security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: money_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/money_test
      DATABASE_URL_UNPOOLED: postgres://postgres:postgrespassword@localhost:5432/money_test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Vulnerability Audit (High/Critical Blocking)
        run: npm run audit:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (Boundary Rules & A11y)
        run: npm run lint

      - name: Boundary Lint Fixtures Regression Check
        run: npm run test:lint-fixtures

      - name: Apply Database Migrations
        run: npm run db:migrate

      - name: Seed Initial Catalog Data
        run: npm run db:seed

      - name: Unit & Integration Tests (PostgreSQL 15 & Domain Coverage >= 80%)
        run: npm run test:coverage

      - name: Build Application
        run: npm run build

      - name: Check Bundle Size Budget (<= 200 KB)
        run: npm run check:bundle-size

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-End Tests (Playwright)
        run: npm run test:e2e

      - name: Run Lighthouse CI Audit
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: './.lighthouserc.json'
          uploadHandler: 'temporary-public-storage'
