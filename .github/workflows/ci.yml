name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan for Leaked Secrets
        uses: gitleaks/gitleaks-action@ca531a7894a4c1dd9eb0e090f4eb789c6ec7a731 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Typecheck, Lint, Tests & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Vulnerability Audit (High/Critical Blocking)
        run: npm run audit:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (Boundary Rules & A11y)
        run: npm run lint

      - name: Boundary Lint Fixtures Regression Check
        run: npm run test:lint-fixtures

      - name: Unit Tests & Domain Coverage (>= 80%)
        run: npm run test:coverage

      - name: Build Application
        run: npm run build

      - name: Check Bundle Size Budget (<= 200 KB)
        run: npm run check:bundle-size

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-End Tests (Playwright)
        run: npm run test:e2e

      - name: Run Lighthouse CI Audit
        uses: treosh/lighthouse-ci-action@94b15bb1916308dd02cecc6e71fe89446d3e8131 # v12.1.0
        with:
          configPath: './.lighthouserc.json'
          uploadHandler: 'temporary-public-storage'
